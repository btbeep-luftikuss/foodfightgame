<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Titans Food Fight</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #22142a; color: #fff4e6; font: 17px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a.play { display: inline-block; margin: 14px 0; padding: 14px 28px; border-radius: 999px; background: #ff6b5a; color: #22142a; font-weight: 800; font-size: 20px; text-decoration: none; }
  small { color: #cdb9c9; }
</style>
</head>
<body>
<main>
  <h1>Tiny Titans Food Fight</h1>
  <p id="msg">That page isn't here, so we're taking you to the game…</p>
  <a class="play" href="/foodfightgame/play/">Play the game</a>
  <p><small>The game's address is<br>btbeep-luftikuss.github.io/foodfightgame/play/<br>(all small letters)</small></p>
</main>
<script>
// GitHub Pages shows this for any address on the site that doesn't exist. Addresses are case-sensitive, so
// "Foodfightgame" or "/Play" (an iPad keyboard capitalises) land here: send anything under the game's site to
// the game, keeping a #quality or ?query. Not twice in a row, in case the game page itself is missing.
(function () {
  var p = location.pathname.toLowerCase();
  var again = false;
  try { again = sessionStorage.getItem('tt-404') === p; sessionStorage.setItem('tt-404', p); } catch (e) { /* storage blocked */ }
  if (p.indexOf('/foodfightgame') === 0 && !again) location.replace('/foodfightgame/play/' + location.search + location.hash);
  else document.getElementById('msg').textContent = "That page isn't here.";
})();
</script>
</body>
</html>
